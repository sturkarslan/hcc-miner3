# Pipeline parameters. Paths are relative to the project root
# (/proj/omics4tb2/sturkarslan/HCC on the server).
#
# Items marked VERIFY are column names or file names that have not been checked
# against the real files yet. Scripts fail with the list of available columns
# when a configured column is missing.

paths:
  data: data
  results: results

# ---------------------------------------------------------------- step 01
cohorts:
  TCGA:
    # UCSC Xena GDC hub; values are log2(TPM + 1) (zero TPM stored as 0.0), versioned Ensembl IDs (GENCODE v36)
    expression: data/LIHC-TCGA-GDC-Xena/TCGA-LIHC.star_tpm.tsv.gz
    format: xena_log2tpm
    pseudocount: 1
    id_type: ensembl
    # Primary tumors only: TCGA sample-type code 01, vial A
    sample_regex: '^TCGA-..-....-01A'
    # Samples to drop (fibrolamellar carcinomas etc.): one sample or patient ID per line
    exclude_list: config/tcga_exclude.tsv
  CLCA:
    # cBioPortal format: Hugo_Symbol [, Entrez_Gene_Id], samples...
    expression: data/HCC-CLCA-2024/data_mrna_seq_tpm.txt
    format: cbioportal_tpm
    id_type: symbol
  LICA_FR:
    expression: data/LICA-FR/RNAseq_tpm_457s.RData
    format: rdata_tpm
    rdata_object: tpm_
    id_type: symbol
    annotation: data/LICA-FR/clinical_molecular_annotations.xlsx
    annotation_id_column: Sample           # values like '#1010T', mapped '#' -> 'CHC'
    annotation_id_prefix_map: {'#': 'CHC'}
    # Keep rows passing every filter: primary tumors (drops NTL, relapse, metastasis),
    # HCC (drops HCC-on-HCA), one tumor per patient (authors' Per_patient_analysis flag)
    keep_filters:
      Sample_type: [primary]
      primary_diagnosis: [HCC]
      Per_patient_analysis: ['yes']
    # Labels carried into the sample table and used for QC in step 02
    label_columns:
      boyault: Boyault_transcriptomic_group
      molecular_group: molecular_group
      immune_class: immune_class_RNAseq_Fluidigm
      etiology: Etiology

id_mapping:
  # Gene names of the GENCODE release used by TCGA (v36, Xena probemap); first mapping tier
  gencode_probemap: data/LIHC-TCGA-GDC-Xena/gencode.v36.annotation.gtf.gene.probemap
  # MINER3 identifier_mappings.txt (Preferred_Name = Ensembl, Name = identifier, Source)
  miner_idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  # Optional HGNC complete set (https://www.genenames.org/download/); null to skip
  hgnc: data/reference/hgnc_complete_set.txt
  # Symbols that map to more than one Ensembl ID are dropped and logged

harmonize:
  # Rescale each sample to sum to 1e6 over the genes shared by all cohorts
  renormalize_tpm: true
  # A gene is kept if TPM >= min_tpm in >= min_frac of samples in EVERY cohort,
  # so cohort-specific detection does not drive the batch effect
  min_tpm: 1.0
  min_frac: 0.2
  # Protein-coding only (needs HGNC locus_group); false keeps all mapped genes
  protein_coding_only: false

# ---------------------------------------------------------------- step 03 (survival)
survival:
  # Common horizon for cross-cohort and validation analyses (CLCA follow-up is reliable to ~36 months;
  # see PROJECT_LOG). Survival is never pooled across cohorts: one MINER file per cohort and endpoint.
  horizon_months: 36

clinical:
  CLCA:
    # Nature 2024 Supplementary Table 1 (user-provided), Table 1a = clinical information
    supplementary: data/HCC-CLCA-2024/41586_2024_7054_MOESM3_ESM.csv
    # No last-follow-up date in the table: censor event-free patients here.
    # Latest recorded recurrence/death is 2021-09. Check against the cBioPortal implied cutoff (logged).
    cutoff_date: '2021-09-30'
    # cBioPortal RFS has times for recurred patients only (169/386), so it cannot show the censoring cutoff
    cbioportal_patient: data/HCC-CLCA-2024/data_clinical_patient.txt
    cbioportal_id_column: PATIENT_ID
    cbioportal_rfs_time_column: RFS              # "Relapse-free survival in days"
    cbioportal_rfs_time_to_days: 1
    cbioportal_rfs_status_column: RFS_STATUS
    use_cbioportal_censoring: false
  TCGA:
    # PanCan 2018 patient file; OS/PFS times are TCGA-CDR values in months
    cbioportal_patient: data/LIHC-TCGA-PanCancerAtlas_2018/data_clinical_patient.txt
    months_to_days: 30.44
    os_columns: [OS_MONTHS, OS_STATUS]
    rfs_columns: [PFS_MONTHS, PFS_STATUS]   # CDR PFI, used as the RFS-like endpoint
    covariates: {age: AGE, sex: SEX, stage: AJCC_PATHOLOGIC_TUMOR_STAGE, subtype: SUBTYPE}

# ---------------------------------------------------------------- step 02
batch:
  methods: [combat, cohort_z]      # combat is the primary; cohort_z is the comparison
  combat_parametric: true
  # MINER's preProcessTPM clips z-scores below -4; apply the same to the final matrix
  z_clip_low: -4.0
  qc:
    n_pcs: 20
    # Symbols of marker programs checked for preservation after correction
    programs:
      CTNNB1: [GLUL, AXIN2, LGR5, TBX3, NKD1, RHBG, SP5]
      proliferation: [MKI67, TOP2A, BIRC5, CCNB1, CDK1, BUB1, AURKA]
      hepatocyte: [ALB, APOA1, CYP3A4, CYP2E1, TTR, SERPINA1]

# ---------------------------------------------------------------- step 04 (MINER3)
miner:
  # Which step-02 matrix to use: results/02_batch_corrected/expression_<matrix>_z.csv
  matrix: combat
  idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  tfs2genes: null            # null = MINER default (tfbsdb_tf_to_genes.pkl)
  # MINER bulk defaults. The GBM single-cell run used min_correlation 0.1 because of sparsity;
  # 0.2 is the MINER default for bulk tumor data.
  min_genes: 6
  min_correlation: 0.2
  min_overexp_samples: 4
  max_exclusion: 0.5
  overexp_threshold: 80
  random_state: 12
  # Step 04c: coexpression modules judged technical (RNA-quality axis; step 04b, PROJECT_LOG).
  # Regulons with >= exclude_min_fraction of genes in them are dropped before subtypes_filtered.
  # Module IDs are from THIS run (random_state 12); re-check them if MINER is rerun.
  exclude_modules: [1, 2, 4, 6]
  exclude_min_fraction: 0.5

# ---------------------------------------------------------------- step 07 (post-analysis)
post:
  signatures_config: config/subtype_signatures.yaml
  # Which MINER subtypes run to map: results/04_miner/<matrix>/<subtypes_dir>/
  subtypes_dir: subtypes_filtered
  min_set_genes: 5             # signatures with fewer genes in the background are skipped
  ntp:                         # Nearest Template Prediction (Hoshida 2010)
    permutations: 1000
    fdr: 0.05
    seed: 1
    center: all                # all = the step-02 z-score across samples; cohort = re-centre within cohort
  causal_figures:              # step 07d
    endpoint: RFS
    n_regulators: 14           # f9: top regulon families per driver (by |Cohen's d|)
    flow_drivers: [MUT_CTNNB1, MUT_TP53, MUT_AXIN1, AMP_CCND1_FGF19, MUT_BAP1, MUT_NFE2L2]
    arm_events: [ARM_1q_gain, ARM_8p_loss, ARM_8q_gain, ARM_17p_loss, ARM_4q_loss, ARM_16q_loss, ARM_13q_loss,
                 ARM_6q_loss, ARM_6p_gain]
  figures:                     # step 07c
    risk_model: ridge_programs_TCGA_RFS_h36m   # step-06 predictor whose score and weights are shown
    endpoint: RFS
    q_max: 0.1                 # prognostic program/state: meta q <= this and same sign in both cohorts
    known_r: 0.8               # "known": |activity r| with a signature >= this, or a direct gene overlap
    min_fold: 3                # direct gene overlap: FDR < 0.05 and fold enrichment >= this
    # f6: known-subtype covariates (signature scores, global mean regressed out; the global mean is added too)
    adjust_signatures: [HOSHIDA_LIVER_CANCER_SUBCLASS_S1, HOSHIDA_LIVER_CANCER_SUBCLASS_S2,
                        HOSHIDA_LIVER_CANCER_SUBCLASS_S3, CHIANG_LIVER_CANCER_SUBCLASS_PROLIFERATION_UP,
                        CHIANG_LIVER_CANCER_SUBCLASS_CTNNB1_UP, VILLANUEVA_LIVER_CANCER_KRT19_UP,
                        DESERT_STEM_CELL_HEPATOCELLULAR_CARCINOMA_SUBCLASS_UP]
  driver_push:                 # step 07e: unbiased test of Figure 1f (see script docstring)
    # Weights from the model trained in `train` are only compared with driver Cox z in `test`.
    pairings:
      - {train: TCGA, train_endpoint: RFS, test: CLCA}
      - {train: CLCA, train_endpoint: RFS, test: TCGA}
    in_sample_reference: true  # also report train == test (the circular version) for contrast
    endpoints: [RFS, OS]       # outcome in the test cohort (36-month files); weights stay RFS-trained
    stage_adjust: true         # also report stage-adjusted driver Cox z (BCLC / AJCC)
    min_altered_test: 10       # driver eligible in a test cohort with >= this many altered and
    min_wt_test: 10            #   >= this many wild-type tumours with survival
    cluster_jaccard: 0.25      # drivers whose altered-tumour sets overlap at Jaccard >= this cluster together
    n_perm: 1000               # program-weight permutations
    n_perm_families: 500       # random-family / random-program draws
    n_boot: 1000               # cluster bootstrap
    seed: 7
    # Pre-specified primary test (fixed before looking at results). Everything else is sensitivity.
    primary: {predictor: d_mean, endpoint: RFS, adjustment: none, driver_set: all}

  axin1_ctnnb1:                # step 07f: AXIN1-only vs CTNNB1-only mutants vs double wild type, every program
    features: {AXIN1: MUT_AXIN1, CTNNB1: MUT_CTNNB1}
    adjust: [MUT_TP53, 55]     # genomic features and program ids (55 = proliferation); cohort is always in
    q_max: 0.05                # BH over programs
    min_group_cohort: 10       # per-cohort sign check needs >= this many mutants of each gene
    genes:                     # marker genes fitted with the same model
      wnt_targets: [GLUL, AXIN2, NKD1, LGR5, TBX3, RNF43, ZNRF3]
      antigen_presentation: [B2M, HLA-A, HLA-B, TAP1, PSMB9]
      interferon: [STAT1, IRF1, CXCL9, CXCL10]
      t_cell: [CD8A, CD3E, GZMK]

# ---------------------------------------------------------------- step 03b (genomic features for causal inference)
genomics:
  min_altered: 15          # altered samples among profiled
  min_freq: 0.03           # fraction of profiled samples
  arm_min_fraction: 0.5    # LICA-FR arm call: >= this fraction of the arm's covered length gained / lost
  # Acrocentric p arms (no genes, unreliable segments) and X (LICA-FR only; sex-confounded)
  exclude_arms: [13p, 14p, 15p, 21p, 22p, Xp, Xq]
  # Curated HCC drivers: LICA-FR driver table genes + TCGA-LIHC 2017 significantly mutated genes + CLCA 2024 drivers.
  # Frequent long-gene passengers (TTN, MUC16, ...) are deliberately not included.
  driver_genes: [CTNNB1, TP53, AXIN1, APC, TERT, NFE2L2, KEAP1, ARID1A, ARID2, ARID1B, BAP1, KMT2A, KMT2C, KMT2D,
                 ALB, APOB, RPS6KA3, TSC1, TSC2, PTEN, PIK3CA, RB1, CDKN2A, CDKN1A, IRF2, HNF1A, ACVR2A, RPL22,
                 SF3B1, IL6ST, EEF1A1, ATM, JAK1, BRD7, FOXO1, HPD, MET, KRAS, NRAS, STAT3, HMBS, PCF11, LZTR1,
                 CREB3L3, AZIN1, GPATCH4, NUP133, CPS1, CYP2E1, FGA, SMARCA4, NCOR1, NOTCH2]
  mutation_classes: [Missense_Mutation, Nonsense_Mutation, Frame_Shift_Del, Frame_Shift_Ins, In_Frame_Del,
                     In_Frame_Ins, Splice_Site, Translation_Start_Site, Nonstop_Mutation]
  pathways:                # OR of member gene mutations (TCGA-LIHC 2017 pathway groups)
    WNT: [CTNNB1, AXIN1, APC]
    p53_cell_cycle: [TP53, RB1, CDKN2A, CDKN1A]
    NRF2_oxidative_stress: [NFE2L2, KEAP1]
    chromatin_remodeling: [ARID1A, ARID1B, ARID2, BAP1, KMT2A, KMT2C, KMT2D, SMARCA4]
    PI3K_mTOR: [TSC1, TSC2, PTEN, PIK3CA, RPS6KA3]
    hepatocyte_differentiation: [ALB, APOB, HNF1A, CPS1, CYP2E1, FGA]
  focal:                   # TCGA GISTIC +2 (amp) / -2 (hd); LICA-FR driver table values
    CCND1_FGF19: {type: amp, genes: [CCND1, FGF19], licafr_column: CCND1_FGF19_Mut, licafr_values: [FA]}
    MYC:         {type: amp, genes: [MYC], licafr_column: MYC_Mut, licafr_values: [FA]}
    VEGFA:       {type: amp, genes: [VEGFA]}
    TERT:        {type: amp, genes: [TERT], licafr_column: TERT_Mut, licafr_values: [focal_ampl]}
    MET:         {type: amp, genes: [MET], licafr_column: MET_alt, licafr_values: [FA]}
    CDKN2A:      {type: hd, genes: [CDKN2A], licafr_column: CDKN2A_Mut, licafr_values: [HD]}
    PTEN:        {type: hd, genes: [PTEN], licafr_column: PTEN_alt, licafr_values: [HD]}
    RB1:         {type: hd, genes: [RB1], licafr_column: RB1_alt, licafr_values: [HD]}
    AXIN1:       {type: hd, genes: [AXIN1], licafr_column: AXIN1_alt, licafr_values: [HD]}
  TCGA:
    maf: data/LIHC-TCGA-PanCancerAtlas_2018/data_mutations.txt
    sequenced_case_list: data/LIHC-TCGA-PanCancerAtlas_2018/case_lists/cases_sequenced.txt
    arm_cna: data/LIHC-TCGA-PanCancerAtlas_2018/data_armlevel_cna.txt
    gistic: data/LIHC-TCGA-PanCancerAtlas_2018/data_cna.txt
    cna_case_list: data/LIHC-TCGA-PanCancerAtlas_2018/case_lists/cases_cna.txt
  CLCA:
    maf: data/HCC-CLCA-2024/data_mutations.txt       # WGS, GRCh37
    sequenced_case_list: data/HCC-CLCA-2024/case_lists/cases_sequenced.txt
    tert_promoter_hotspots_hg19: [1295228, 1295250]   # C228T, C250T
  LICA_FR:
    mutations: data/LICA-FR/somatic_mutations_529s.RData
    mutations_object: mutation.dat_revised
    mutation_class_keep: [Missense, Truncating, Inframe]
    min_vaf: 0.1             # TUMOR_AF.brc; reproduces the curated driver table
    driver_table: data/LICA-FR/summary_driver_alterations_table_529s.xlsx
    segments: data/LICA-FR/cna_data_529.RData
    segments_object: wxs_seg
    cytoband: data/reference/cytoBand_hg38.txt.gz      # LICA-FR segments are hg38 (see PROJECT_LOG)

# ---------------------------------------------------------------- step 05 (causal inference)
causal:
  alpha: 0.05              # MINER's nominal threshold for each test (as miner3-causalinference)
  q_max: 0.1               # high-confidence: BH q (per feature) for the regulon test and the mutation-regulator edge
  min_cohort_altered: 5    # a cohort is tested when it has >= this many altered and wild-type samples
  min_cohorts: 2           # high-confidence needs >= this many tested cohorts, all agreeing in direction
  family_r: 0.9            # regulon families: average-linkage clusters of eigengenes with r >= this
  min_abs_d: 0.5           # high-confidence: |Cohen's d| of the regulon eigengene, altered vs wild type
  min_altered_hc: 30       # high-confidence: feature altered in >= this many profiled samples (small-group d is unstable)
  gene_positions: data/LIHC-TCGA-GDC-Xena/gencode.v36.annotation.gtf.gene.probemap   # hg38, for cis-dosage flag
  cytoband: data/reference/cytoBand_hg38.txt.gz

# ---------------------------------------------------------------- step 06 (risk)
risk:
  subtypes_dir: subtypes_filtered
  survival_cohorts: [TCGA, CLCA]      # LICA-FR has no survival
  endpoints: [RFS, OS]                # RFS = CLCA RFS / TCGA PFS
  survival_suffix: _h36m              # common 36-month horizon (never pool survival across cohorts)
  q_max: 0.1                          # prognostic: BH q of the meta-z, same sign in every cohort
  # MINER generatePredictor (xgboost 1.7.6 from envs/pylib-miner)
  method: xgboost
  n_estimators: 100
  iterations: 20
  class1_proportion: 0.2              # top 20% GuanRank within the training cohort = high risk
  test_proportion: 0.35
  train_test:                         # train in one cohort, evaluate in the others (never seen)
    - {train: TCGA, endpoint: RFS, test: [CLCA]}
    - {train: TCGA, endpoint: OS, test: [CLCA]}
    - {train: CLCA, endpoint: RFS, test: [TCGA]}
  ridge:                              # MINER optimize_ridge_model (Part C; primary risk model)
    features: [programs, regulons]
    train_cut_low: 0.5                # low-risk training class = bottom 50% by GuanRank (MINER default)
    n_iter: 250                       # bootstrap iterations for alpha
    max_alpha: 5000
    alpha_step: 100
    seed: 12

# ---------------------------------------------------------------- step 08 (external validation)
validation:
  horizon_days: 1096                 # 36 months, as in discovery
  top_fraction: 0.2                  # within-cohort top 20% = predicted high risk
  min_regulon_coverage: 0.5          # regulon scored if >= this fraction of its genes is measured
  models: [TCGA_RFS_h36m, TCGA_OS_h36m, CLCA_RFS_h36m]   # step-06 ridge program models (weights never refit)
  cohorts:
    GSE14520:                        # LCI (Roessler 2010), Affymetrix HT_HG-U133A (GPL3921), HBV-dominant, resected
      loader: geo_gse14520
      expression: data/external_validation/GSE14520/GSE14520-GPL3921_series_matrix.txt.gz
      platform_annot: data/external_validation/GSE14520/GPL3921.annot.gz
      annot_skiprows: 27
      clinical: data/external_validation/GSE14520/GSE14520_Extra_Supplement.txt.gz
      endpoints: [RFS, OS]
    LIRI_JP:                         # ICGC LIRI-JP via HCCDB18 (RNA-seq, log2), Japanese, HCV-dominant; OS only
      loader: hccdb
      expression: data/external_validation/HCCDB18_LIRI-JP/HCCDB18_mRNA_level3.txt
      sample: data/external_validation/HCCDB18_LIRI-JP/HCCDB18.sample.txt
      patient: data/external_validation/HCCDB18_LIRI-JP/HCCDB18.patient.txt
      os: {time: SUR, to_days: 30.44, status: STATUS, event_values: [Dead]}     # SUR in months
      stage_column: TNM_STAGE_T1
      stage_map: {I: 1, II: 2, III: 3, IV: 4}
      log2: false                    # level-3 values are already log2 (max ~16)
      endpoints: [OS]
    GSE76427:                        # Singapore (Grinchuk 2018) via HCCDB17, Illumina HT-12 v4 (log2)
      loader: hccdb
      expression: data/external_validation/GSE76427/HCCDB17_mRNA_level3.txt
      sample: data/external_validation/GSE76427/HCCDB17.sample.txt
      patient: data/external_validation/GSE76427/HCCDB17.patient.txt
      os: {time: OS_YEAR, to_days: 365.25, status: OS_STATUS, event_values: [Dead]}
      rfs: {time: RFS_YEAR, to_days: 365.25, status: RFS_STATUS, event_values: ["Yes"]}   # Yes = recurred
      stage_column: BCLC_STAGE
      stage_map: {"0": 0, A: 1, B: 2, C: 3}
      log2: false
      endpoints: [RFS, OS]
