# Published trial arms for in-silico trial emulation (docs/trial_emulation_design.md), HCC.
# One entry per arm; `verified` lists fields checked against the paper or a review of it (2026-10-02 / 10-05); arm
# sizes are verified only where `n` is listed; NCT IDs are not yet recorded. Fill `population` from each trial's Table 1.
# orr_criteria: RECIST1.1 | mRECIST; reviewer: independent | investigator. Never pool across criteria.

defaults:
  n_cohorts: 1000
  seed: 12

arms:
  IMBRAVE150_atezo_bev:
    trial: IMbrave150 (updated analysis)
    setting: 1L advanced HCC
    drugs: [atezolizumab, bevacizumab]
    n: 326                                  # response-evaluable (ITT 336)
    orr: 0.30
    orr_mrecist: 0.35
    orr_criteria: RECIST1.1
    reviewer: independent
    control_arm: IMBRAVE150_sorafenib
    eligibility: {filters: {}, unmatched: [Child-Pugh A, ECOG 0-1, varices treated, no prior systemic therapy]}
    population: {hbv: null, hcv: null, nonviral: null, asia: null, mvi_or_ehs: null, afp_ge_400: null}
    source: "Cheng et al., J Hepatol 2022 (PMC8366100 response analysis)"
    verified: [orr, orr_mrecist, n]
  IMBRAVE150_sorafenib:
