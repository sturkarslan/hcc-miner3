    - {cohort: Japan multicentre, orr_mrecist: 0.347, dcr: 0.816, source: "Liver Cancer 2021"}
    - {cohort: Korea, orr_mrecist: 0.189, dcr: 0.757, source: "Liver Cancer 2021"}
